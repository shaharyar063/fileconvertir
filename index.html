<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>FileConvertir — Free Online File Converter | Images, Docs, Audio, Video</title>
    <meta name="description" content="Convert images, documents, audio, video, fonts & archives instantly in your browser. 100% private — your files never leave your device. No signup required." />
    <meta name="keywords" content="file converter, image converter, pdf converter, audio converter, video converter, online converter, free converter, png to jpg, jpg to pdf, mp3 converter, webp converter, fileconvertir" />
    <meta name="author" content="FileConvertir" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#6366F1" />
    <link rel="canonical" href="https://fileconvertir.com/" />

    <!-- Favicon — SVG for modern browsers, ICO fallback -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="mask-icon" href="/favicon.svg" color="#6366F1" />

    <!-- Open Graph -->
    <meta property="og:title" content="FileConvertir — Free Online File Converter" />
    <meta property="og:description" content="Convert images, documents, audio, video, fonts & archives instantly in your browser. 100% private — no uploads, no signup." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fileconvertir.com/" />
    <meta property="og:site_name" content="FileConvertir" />
    <meta property="og:image" content="https://fileconvertir.com/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FileConvertir — Free Online File Converter" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FileConvertir — Free Online File Converter" />
    <meta name="twitter:description" content="Convert images, documents, audio, video, fonts & archives instantly in your browser. 100% private." />
    <meta name="twitter:image" content="https://fileconvertir.com/og-image.svg" />
    <meta name="twitter:image:alt" content="FileConvertir — Free Online File Converter" />

    <!-- Structured Data: WebSite + WebApplication -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FileConvertir",
        "url": "https://fileconvertir.com",
        "description": "Free online file converter supporting images, documents, audio, video, fonts and archives.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://fileconvertir.com/{search_term_string}-converter"
          },
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "FileConvertir",
        "url": "https://fileconvertir.com",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript. Requires a modern browser.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Free online file converter. Convert images, documents, audio, video, fonts & archives instantly in your browser. 100% private — files never leave your device.",
        "featureList": [
          "100% browser-based — no file uploads",
          "Supports 200+ conversion types",
          "Batch conversion up to 20 files",
          "No signup or account required"
        ]
      }
    ]
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
