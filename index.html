<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>FileConvertir — Free Online File Converter</title>
    <meta name="description" content="Convert images, documents, audio, video, fonts & archives instantly in your browser. 100% private — your files never leave your device. No signup required." />
    <meta name="author" content="FileConvertir" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#FBF3DC" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('fc-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = theme === 'dark' ? '#0A0A0A' : '#FBF3DC';
        } catch (e) {}
      })();
    </script>
    <link rel="canonical" href="https://fileconvertir.com/" />

    <!-- Favicon — SVG for modern browsers, ICO fallback -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="mask-icon" href="/favicon.svg" color="#0A0A0A" />

    <!-- Google Analytics -->
