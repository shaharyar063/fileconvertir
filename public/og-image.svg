<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0D0F1E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0F1E"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo icon box -->
  <rect x="526" y="148" width="88" height="88" rx="20" fill="#6366F1"/>
  <!-- Arrow right (white) -->
  <line x1="544" y1="177" x2="580" y2="177" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
  <polyline points="569,167 582,177 569,187" fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow left (cyan) -->
  <line x1="596" y1="197" x2="560" y2="197" stroke="#a5f3fc" stroke-width="5.5" stroke-linecap="round"/>
  <polyline points="571,187 558,197 571,207" fill="none" stroke="#a5f3fc" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brand name -->
  <text x="630" y="208" font-family="Inter, -apple-system, sans-serif" font-size="54" font-weight="800" fill="#EEF0F8" text-anchor="middle" letter-spacing="-1">
    File<tspan fill="#818CF8">Convertir</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="276" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#6B7280" text-anchor="middle">
