  <text x="270" y="353" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#818CF8">Images</text>
  <text x="395" y="353" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#818CF8">Documents</text>
  <text x="545" y="353" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#818CF8">Audio</text>
  <text x="660" y="353" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#818CF8">Video</text>
  <text x="760" y="353" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#818CF8">Fonts</text>
  <text x="860" y="353" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#818CF8">Archives</text>
  <!-- Separator dots -->
  <circle cx="368" cy="346" r="3" fill="#1E2240"/>
  <circle cx="518" cy="346" r="3" fill="#1E2240"/>
  <circle cx="632" cy="346" r="3" fill="#1E2240"/>
  <circle cx="732" cy="346" r="3" fill="#1E2240"/>
  <circle cx="832" cy="346" r="3" fill="#1E2240"/>

  <!-- Domain -->
  <text x="600" y="440" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#374060" text-anchor="middle">
